<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkVault</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d12'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%23e0a45a'/%3E%3Cpath d='M14.2 16.5h3.6v8h-3.6z' fill='%23e0a45a'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}
html,body{height:100%;max-width:100%}
body{
  --bd:color-mix(in srgb,var(--tx) 14%,transparent);
  --s1:color-mix(in srgb,var(--tx) 7%,transparent);
  --s2:color-mix(in srgb,var(--tx) 13%,transparent);
  --gl:color-mix(in srgb,var(--sf) 74%,transparent);
  --dm:color-mix(in srgb,var(--tx) 58%,transparent);
  --as:color-mix(in srgb,var(--ac) 28%,transparent);
  --bg:#0c0d12;--sf:#16171e;--tx:#f4efe4;--ac:#e0a45a;
  margin:0;font:14px/1.45 Outfit,"Avenir Next","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);overflow:hidden;user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input,textarea,.to,.pre,.quote{user-select:text}
#bg{position:fixed;inset:-24px;background-size:cover;background-position:center;filter:blur(var(--bgb,0px));z-index:0}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:0}
#scene{position:fixed;inset:0;z-index:1;overflow:hidden;--px:0;--py:0}
#scene .layer{position:absolute;inset:0;pointer-events:none}
#scene .fill{width:100%;height:100%;display:block}
#scene.lit::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 22% 72%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 46%);z-index:2}
#scene.flash::after{content:"";position:absolute;inset:0;background:#fff;opacity:.45;pointer-events:none}
.obj{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 12px 16px #0007);transform:translate(calc(var(--px) * var(--dep) * 1px),calc(var(--py) * var(--dep) * 1px))}
.obj svg{width:100%;height:auto;display:block;overflow:visible}
.obj .bob{animation:bob 5.2s ease-in-out infinite}
.obj .swim{animation:swim 7s ease-in-out infinite}
.obj.dragging{z-index:8;cursor:grabbing}
.obj.dragging .bob,.obj.dragging .swim{animation:none}
.obj.popped{filter:drop-shadow(0 0 16px var(--ac))}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes swim{50%{transform:translate(16px,-7px)}}
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.bub{animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-220px)}}
#grid{position:fixed;inset:0;pointer-events:none;z-index:2;background-image:linear-gradient(var(--s1) 1px,transparent 1px),linear-gradient(90deg,var(--s1) 1px,transparent 1px);background-size:42px 42px}
body.ng #grid{display:none}
#widgets{position:fixed;z-index:3;left:22px;top:68px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.widget{pointer-events:auto;width:min(240px,70vw);padding:14px 16px 12px;border-radius:18px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 40px #0004}
.widget .big{font-size:40px;font-weight:600;letter-spacing:-.05em;line-height:1}
.widget .sub{color:var(--dm);margin-top:2px}
.brass{color:var(--ac)!important}
#desk{position:fixed;z-index:4;inset:48px 0 0;pointer-events:none}
#desk .win{pointer-events:auto}
#bar{position:fixed;z-index:30;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--bd)}
#bar .sp{flex:1}
body.fs #desk{z-index:31}
.win.fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;border:0}
body.fs #bar{z-index:50;transform:translateY(-100%);transition:transform .22s ease}
body.fs.peek #bar{transform:none}
#hot{position:fixed;top:0;left:0;right:0;height:8px;z-index:60;display:none}
body.fs #hot{display:block}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:10px;padding:4px 6px;font-weight:650;letter-spacing:-.02em}
.logo:hover{background:var(--s1)}
.logo svg{display:block}
#me{display:flex;align-items:center;gap:8px;color:var(--dm);min-width:0}
#me{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--s2);font-size:13px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:34px}
#dot{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
#dot.on{background:#4ade80}
#clk{font-variant-numeric:tabular-nums;color:var(--dm);min-width:42px}
#dock{position:fixed;z-index:30;display:flex;gap:6px;padding:8px;background:var(--gl);backdrop-filter:blur(var(--bl,22px)) saturate(1.4);border:1px solid var(--bd);border-radius:22px;max-width:calc(100% - 24px);overflow:auto}
.dk{width:48px;height:48px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;background:var(--s1);border:1px solid transparent;transition:transform .16s cubic-bezier(.2,.8,.2,1),background .15s}
.dk .ico{width:22px;height:22px}
body.dock-b .dk:hover{transform:translateY(-7px) scale(1.06)}
body.dock-l .dk:hover,body.dock-r .dk:hover{transform:scale(1.08)}
.dk.run::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
body.dock-l .dk.run::after,body.dock-r .dk.run::after{bottom:auto;right:4px;top:50%}
.dk span{position:absolute;bottom:58px;background:var(--sf);border:1px solid var(--bd);padding:3px 8px;border-radius:8px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
body.dock-l .dk span{left:58px;bottom:auto;top:50%;transform:translateY(-50%)}
body.dock-r .dk span{right:58px;left:auto;bottom:auto;top:50%;transform:translateY(-50%)}
.dk:hover span{opacity:1}
body.dks .dk{width:40px;height:40px}
body.dkl .dk{width:56px;height:56px}
body.dkl .dk .ico{width:26px;height:26px}
.btn{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.15s;min-height:36px}
.btn:hover{background:var(--s2)}
.btn.p{background:var(--as);border-color:var(--ac)}
.btn.d{color:#f87171;border-color:#f8717180;background:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dm)}
.btn.ghost:hover{background:var(--s1);color:var(--tx)}
.btn:focus-visible,.dk:focus-visible,.logo:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
kbd{font:11px/1 IBM Plex Mono,ui-monospace,monospace;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--dm)}
#panic{background:#f8717122;border:1px solid #f8717166;color:#f87171;border-radius:9px;padding:6px 10px;min-height:32px}
.win{position:absolute;display:flex;flex-direction:column;background:color-mix(in srgb,var(--sf) 84%,transparent);backdrop-filter:blur(var(--bl,22px)) saturate(1.4);border:1px solid var(--bd);border-radius:var(--r,18px);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 18%,transparent),0 24px 70px #0008;overflow:hidden;min-width:280px;min-height:180px;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.win.f{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd))}
.win.h{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:grab;font-weight:600;touch-action:none}
.tl{display:flex;gap:6px}
.tl i{width:12px;height:12px;border-radius:50%;cursor:pointer}
.tt{flex:1;text-align:center;padding-right:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{flex:1;min-height:0;overflow:auto;position:relative}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none}
.col{display:flex;flex-direction:column;height:100%;min-height:0}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.center-col{align-items:center;justify-content:center;text-align:center;height:100%;gap:12px}
.h-lg{font-size:20px;letter-spacing:-.03em}
.sub{color:var(--dm);font-size:12px}
.lede{color:var(--dm);margin:0}
.mono{font-family:IBM Plex Mono,ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;padding:8px 8px 0;overflow:auto;flex-shrink:0}
.tab{display:flex;align-items:center;gap:6px;padding:7px 10px;min-width:108px;max-width:180px;border-radius:10px 10px 0 0;color:var(--dm);cursor:pointer;background:transparent;border:0}
.tab.on{background:color-mix(in srgb,var(--sf) 70%,transparent);color:var(--tx)}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.tab u{text-decoration:none;opacity:.55}
.tab.plus{min-width:36px}
.tool{padding:8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.tool input{flex:1}
.ld{height:2px;background:var(--ac);width:0;transition:width .35s}
.view{flex:1;position:relative;min-height:0}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.ntp{height:100%;padding:28px 20px;text-align:center;overflow:auto}
.ntp-clock{font-size:clamp(42px,8vw,76px);font-weight:600;letter-spacing:-.055em;line-height:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:680px;margin:18px auto 0}
.card{padding:14px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);cursor:pointer;font-size:12px;text-align:center}
.card b{display:block;font-size:18px;margin-bottom:4px}
.card:hover{background:var(--s2)}
.pad{padding:16px}
.store{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.app{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);align-items:center}
.app .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex-shrink:0}
.app .ic .ico{width:22px;height:22px}
.app div:nth-child(2){flex:1;min-width:0}
.app small{color:var(--dm);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notes{display:grid;grid-template-columns:168px 1fr;height:100%}
.nl{border-right:1px solid var(--bd);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.items{display:flex;flex-direction:column;gap:4px}
.ni{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.ni.on{background:var(--as)}
.ni:hover{background:var(--s2)}
.ni span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni u{text-decoration:none;opacity:.5}
textarea{flex:1;background:none;border:0;outline:none;resize:none;padding:16px;font:14px/1.55 IBM Plex Mono,ui-monospace,monospace;color:var(--tx);min-height:0}
.term{font:13px/1.5 IBM Plex Mono,ui-monospace,monospace;padding:12px;display:flex;flex-direction:column;height:100%}
.to{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word}
.to .e{color:#f87171}.to .k{color:#86efac}.to .m{color:var(--dm)}
.term input{flex:1;background:none;border:0;padding:0;border-radius:0}
.ti{display:flex;gap:8px;border-top:1px solid var(--bd);padding-top:8px;align-items:center}
.ti span{color:var(--ac)}
.st{display:flex;height:100%}
.sn{width:148px;border-right:1px solid var(--bd);padding:8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.sn div{padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--dm)}
.sn div.on{background:var(--as);color:var(--tx)}
.sp2{flex:1;overflow:auto;padding:16px}
.sg{margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.sg h3{font-size:12px;color:var(--dm);font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;flex-wrap:wrap}
.sr input[type=range]{accent-color:var(--ac);width:140px}
.sr select,.sr input[type=text],.sr input:not([type]){background:var(--sf)}
.tg{width:40px;height:24px;border-radius:12px;background:var(--s2);position:relative;cursor:pointer;flex-shrink:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dm);transition:.15s}
.tg.on{background:var(--as)}
.tg.on::after{transform:translateX(16px);background:var(--ac)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tc{height:52px;border-radius:12px;cursor:pointer;border:2px solid var(--bd);font-size:11px;padding:4px}
.tc.on{border-color:var(--ac)}
.achs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.achc{text-align:left;opacity:.4}
.achc.got{opacity:1;border-color:color-mix(in srgb,var(--ac) 50%,var(--bd))}
.achc small{display:block;color:var(--dm)}
.ap{display:flex;flex-wrap:wrap;gap:6px}
.ap .av{width:36px;height:36px;font-size:18px;cursor:pointer;border:1px solid var(--bd);border-radius:10px}
.ap .av.on{border-color:var(--ac);background:var(--as)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;height:100%;grid-auto-rows:1fr}
.calc .scr{grid-column:1/-1;text-align:right;font-size:28px;padding:8px 10px;background:var(--s1);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.ul{display:flex;flex-direction:column;gap:8px;overflow:auto}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.ov.show{display:flex}
.mod{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:22px;width:min(420px,100%);max-height:min(92vh,720px);overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 80px #000a}
.mod label{color:var(--dm);font-size:12px}
.err{color:#f87171;min-height:18px;font-size:12px}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px}
.seg div{flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;color:var(--dm)}
.seg div.on{background:var(--sf);color:var(--tx)}
.logo-row{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.03em}
.toast{position:fixed;top:60px;right:16px;background:var(--sf);border:1px solid var(--bd);padding:10px 14px;border-radius:14px;z-index:70;box-shadow:0 12px 40px #0006;max-width:min(320px,calc(100% - 32px))}
.toast.ach{display:flex;gap:10px;align-items:center;border-color:var(--ac)}
.mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--as);color:var(--ac)}
#spot{align-items:flex-start;padding-top:min(14vh,120px)}
.spotmod{padding:0;overflow:hidden;width:min(560px,100%)}
#sq{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px;width:100%;background:transparent;font-size:16px}
#sres{max-height:320px;overflow:auto}
.srow{padding:11px 16px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;align-items:center}
.srow.on,.srow:hover{background:var(--as)}
#qpanel{position:fixed;z-index:35;top:58px;right:12px;width:min(320px,calc(100% - 24px));background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px #0008}
#qpanel[hidden]{display:none}
#menu{position:fixed;z-index:45;min-width:200px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:6px;box-shadow:0 16px 50px #0008}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;min-height:40px}
#menu button:hover{background:var(--s2)}
.gwrap{display:flex;flex-direction:column;height:100%;min-height:0;gap:8px;padding:10px}
.gstage{position:relative;flex:1;min-height:160px}
.gstage canvas{width:100%;height:100%;display:block;border-radius:12px;background:#101218;touch-action:none}
.ghud{display:flex;align-items:center;gap:8px}
.gscore{font-variant-numeric:tabular-nums;font-size:16px}
.gpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gpad button,.flap{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);font-size:16px}
.mine{display:grid;gap:3px;flex:1}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--bd);background:var(--s1);font-weight:650}
.cell.open{background:var(--sf)}
.cell.bad{background:#7f1d1d;color:#fff}
.merge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:240px}
.tile{border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:clamp(16px,4vw,26px);background:var(--s1)}
.tile[data-v="2"]{background:#3a3428;color:#f4efe4}
.tile[data-v="4"]{background:#4a3b24}
.tile[data-v="8"]{background:#6b4a28}
.tile[data-v="16"]{background:#8a6232}
.tile[data-v="32"]{background:#a86838}
.tile[data-v="64"]{background:#c46a45}
.tile[data-v="128"]{background:#d4894a}
.tile[data-v="256"]{background:#e0a45a;color:#1c1915}
.tile[data-v="512"]{background:#ef8f62;color:#1c1915}
.tile[data-v="1024"],.tile[data-v="2048"],.tile[data-v="4096"]{background:#f4efe4;color:#1c1915}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pcard{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--s1);font-size:22px}
.pcard.on{background:var(--as);border-color:var(--ac)}
.board{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:6px}
.cw{width:48px;height:48px;border-radius:8px;border:1px solid var(--bd);display:grid;place-items:center;font-weight:700}
.cw.g{background:#3f6b4a;border-color:#3f6b4a;color:#fff}
.cw.y{background:#a6843a;border-color:#a6843a;color:#fff}
.cw.b{background:var(--s2);color:var(--dm)}
.keys{display:flex;flex-direction:column;gap:6px;width:min(420px,100%)}
.krow{display:flex;gap:4px;justify-content:center}
.krow button{min-width:28px;min-height:42px;padding:0 6px;border-radius:7px;border:0;background:var(--s2);text-transform:uppercase}
.krow button.g{background:#3f6b4a;color:#fff}
.krow button.y{background:#a6843a;color:#fff}
.krow button.b{background:#2a2a2a;color:#888}
.xo{display:grid;grid-template-columns:repeat(3,88px);gap:8px}
.xo button{height:88px;border-radius:14px;border:1px solid var(--bd);background:var(--s1);font-size:36px}
.quote{font-size:18px;line-height:1.45;letter-spacing:-.02em}
.quote .ok{color:var(--ac)}
.quote .bad{color:#f87171;text-decoration:underline}
.drop{border:1px dashed var(--bd);border-radius:14px;padding:16px;text-align:center;color:var(--dm)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);padding:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:48px}
.bars i{display:block;width:8px;height:12px;border-radius:4px;background:var(--ac);opacity:.35}
.bars.on i{animation:eq 1s ease-in-out infinite}
.bars.on i:nth-child(odd){animation-delay:.2s}
.bars.on i:nth-child(3n){animation-delay:.4s}
@keyframes eq{50%{height:40px;opacity:1}}
.pre{margin:0;padding:14px;white-space:pre-wrap;font:13px/1.5 IBM Plex Mono,ui-monospace,monospace}

      const k = cfg.proxyFit !== false && vw > 0 && vw < FITW ? vw / FITW : 1;
      if (k === 1) { f.style.width = ''; f.style.height = ''; f.style.transform = ''; return; }
      f.style.width = FITW + 'px'; f.style.height = (vh / k) + 'px';
      f.style.transform = `scale(${k})`; f.style.transformOrigin = '0 0';
    });
  }
  new ResizeObserver(fitFrames).observe(view);
  const fitBtn = el('<button class="btn" type="button" title="Fit the page to the window">Fit</button>');
  fitBtn.classList.toggle('p', cfg.proxyFit !== false);
  fitBtn.onclick = async () => { cfg.proxyFit = cfg.proxyFit === false; fitBtn.classList.toggle('p', cfg.proxyFit !== false); await save(); fitFrames(); };
  star.before(fitBtn);
  let tabs = [], cur = null, marks = [], drag = null;
  const tab = () => tabs.find((t) => t.id === cur);
  const mk = (url = '') => ({ id: Math.random().toString(36).slice(2, 8), url: '', title: 'New tab', hist: [], pos: -1, fr: null, ...(url ? { pending: url } : {}) });
  const persist = () => put('tabs', { cur, tabs: tabs.map(({ id, url, title, hist, pos }) => ({ id, url, title, hist, pos })) });
  function add(url) { const t = mk(); tabs.push(t); cur = t.id; draw(); if (url) go(url); else inp.focus(); }
  function closeT(id) {
    const i = tabs.findIndex((t) => t.id === id);
    if (i < 0) return;
    tabs[i].fr && tabs[i].fr.remove();
    tabs.splice(i, 1);
    if (!tabs.length) return add();
    if (cur === id) cur = tabs[Math.max(0, i - 1)].id;
    draw();
  }
  function go(raw, push = true) {
    const t = tab(), u = resolve(raw);
    if (!t || !u) return;
    if (!needProxy()) return;
    if (push) { t.hist = t.hist.slice(0, t.pos + 1); t.hist.push(u); t.pos = t.hist.length - 1; }
    t.url = u; t.title = hostOf(u); visit(u);
    if (t.fr) { t.fr.remove(); t.fr = null; }
    draw();
  }
  function step(n) {
    const t = tab(); if (!t) return;
    const p = t.pos + n; if (p < 0 || p >= t.hist.length) return;
    t.pos = p; const u = t.hist[p]; t.url = u; t.title = hostOf(u);
    if (t.fr) { t.fr.remove(); t.fr = null; }
    draw();
  }
  function frame(t) {
    if (t.fr) return t.fr;
    const f = document.createElement('iframe');
    f.referrerPolicy = 'no-referrer';
    f.allow = 'clipboard-read; clipboard-write; fullscreen; autoplay';
    f.onload = () => { ld.style.width = '100%'; setTimeout(() => { ld.style.width = '0'; }, 300); };
    t.fr = f; return f;
  }
  function ntp() {
    const q = [...marks, { url: 'https://duckduckgo.com', title: 'DuckDuckGo' }, { url: 'https://www.wikipedia.org', title: 'Wikipedia' }, { url: 'https://archive.org', title: 'Archive' }].filter((m, i, a) => a.findIndex((x) => x.url === m.url) === i);
    const n = el('<div class="ntp"><div class="ntp-clock"></div><p class="lede"></p><div class="grid"></div></div>');
    const d = new Date();
    $('.ntp-clock', n).textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    $('.lede', n).textContent = greet() + ' — search above, or jump somewhere.';
    q.forEach((m) => {
      const c = el('<button class="card" type="button"></button>');
      const b = el('<b></b>'); b.textContent = (m.title || hostOf(m.url) || '?').slice(0, 1).toUpperCase();
      const sp = el('<span></span>'); sp.textContent = m.title || hostOf(m.url);
      c.append(b, sp);
      c.onclick = () => go(m.url);
      $('.grid', n).append(c);
    });
    return n;
  }
  function draw() {
    tabsEl.replaceChildren();
    tabs.forEach((t) => {
      const e = el(`<div class="tab${t.id === cur ? ' on' : ''}" draggable="true"><span></span><u>✕</u></div>`);
      $('span', e).textContent = t.title || 'New tab';
      e.onclick = (ev) => { if (ev.target.tagName === 'U') closeT(t.id); else { cur = t.id; draw(); } };
      e.ondragstart = () => { drag = t.id; };
      e.ondragover = (ev) => ev.preventDefault();
      e.ondrop = () => { const a = tabs.findIndex((x) => x.id === drag), b = tabs.indexOf(t); if (a >= 0 && a !== b) { tabs.splice(b, 0, tabs.splice(a, 1)[0]); draw(); } };
      tabsEl.append(e);
    });
    tabsEl.append(el('<button class="tab plus" type="button">+</button>', { onclick: () => add() }));
    const t = tab();
    inp.value = t ? t.url : '';
    star.textContent = t && marks.some((m) => m.url === t.url) ? '★' : '☆';
    view.replaceChildren();
    if (t && t.url && cfg.sessionToken && cfg.server) {
      const f = frame(t); view.append(f); fitFrames();
      const src = pUrl(t.url);
      if (f.dataset.s !== src) { ld.style.width = '70%'; f.dataset.s = src; f.src = src; }
    } else view.append(ntp());
    persist();
  }
  s.api = { add };
  s.body.onclick = (ev) => {
    const a = ev.target.dataset && ev.target.dataset.a;
    if (!a) return;
    const t = tab();
    if (a === 'g') go(inp.value);
    else if (a === 'b') step(-1);
    else if (a === 'f') step(1);
    else if (a === 'r' && t && t.url) { t.fr && t.fr.remove(); t.fr = null; draw(); }
    else if (a === 's' && t && t.url) {
      const i = marks.findIndex((m) => m.url === t.url);
      if (i >= 0) marks.splice(i, 1); else marks.push({ url: t.url, title: t.title });
      put('marks', marks); draw();
    }
  };
  inp.onkeydown = (ev) => { if (ev.key === 'Enter') go(inp.value); };
  s.e.addEventListener('keydown', (ev) => {
    if (!ev.ctrlKey && !ev.metaKey) return;
    if (ev.key === 't') { ev.preventDefault(); add(); }
    else if (ev.key === 'w') { ev.preventDefault(); closeT(cur); }
    else if (ev.key === 'l') { ev.preventDefault(); inp.select(); }
  });
  Promise.all([get('tabs'), get('marks')]).then(([sv, mk2]) => {
    marks = Array.isArray(mk2) ? mk2 : [];
    if (sv && sv.tabs && sv.tabs.length) {
      tabs = sv.tabs.map((t) => ({ ...t, fr: null }));
      cur = tabs.some((t) => t.id === sv.cur) ? sv.cur : tabs[0].id;
      draw(); if (start) add(start);
    } else add(start);
  });
}

/* ---------- games ---------- */
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.max(10, r.width), h = Math.max(10, r.height);
  const W = Math.floor(w * dpr), H = Math.floor(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function loop(dead, update, draw) {
  let last = performance.now();
  function frame(t) {
    if (dead()) return;
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (!document.hidden) { update(dt); draw(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function hud(parent) {
  parent.insertAdjacentHTML('afterbegin', '<div class="ghud"><b class="gscore">0</b><span class="sub gbest"></span><button class="btn" type="button" data-a="pause">Pause</button><button class="btn" type="button" data-a="again">Again</button></div>');
}

  const s = win({ title: 'Serpent', app: 'serpent', w: 480, h: 620, onClose() { dead = true; removeEventListener('keydown', onKey); } });
  s.body.innerHTML = '<div class="gwrap"><div class="gstage"><canvas></canvas></div><div class="gpad"><button type="button" data-k="u">↑</button><button type="button" data-k="l">←</button><button type="button" data-k="d">↓</button><button type="button" data-k="r">→</button></div><p class="sub">Arrows or WASD. A is left.</p></div>';
  hud(s.body.querySelector('.gwrap'));
  const cv = $('canvas', s.body);
  const N = 18;
  let snake, dir, next, food, acc, step, score, over, paused;
  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 }; next = { x: 1, y: 0 };
    score = 0; acc = 0; step = 0.16; over = false; paused = false; placeFood();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some((p) => p.x === food.x && p.y === food.y));
  }
  function turn(x, y) { if (dir.x === -x && dir.y === -y) return; next = { x, y }; }
  onKey = (e) => {
    if (!s.e.classList.contains('f')) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') turn(-1, 0);
    else if (k === 'arrowright' || k === 'd') turn(1, 0);
    else if (k === 'arrowup' || k === 'w') turn(0, -1);
    else if (k === 'arrowdown' || k === 's') turn(0, 1);
    else if (k === 'p') paused = !paused;
    else return;
    e.preventDefault();
  };
  addEventListener('keydown', onKey);
  s.body.onclick = (e) => {
    const k = e.target.dataset.k;
    if (k === 'l') turn(-1, 0); if (k === 'r') turn(1, 0); if (k === 'u') turn(0, -1); if (k === 'd') turn(0, 1);

  let sx = 0, sy = 0;

  });
  function tick() {
    dir = next;

    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some((p) => p.x === h.x && p.y === h.y)) {

    }

    else snake.pop();
  }
  reset();
  loop(() => dead, (dt) => { if (paused || over) return; acc += dt; while (acc >= step) { acc -= step; tick(); if (over) break; } }, () => {
    const { ctx, w, h } = fitCanvas(cv);
    const cw = w / N, ch = h / N;

    snake.forEach((p, i) => {

    });

    $('.gbest', s.body).textContent = 'best ' + (cfg.scores.serpent || 0);
  });
}

  function cells(p) { return SHAPES[p.id][p.r % SHAPES[p.id].length].map(([x, y]) => [x + p.x, y + p.y]); }
  function fits(p) { return cells(p).every(([x, y]) => x >= 0 && x < COLS && y < ROWS && (y < 0 || !grid[y][x])); }
  function reset() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    queue = []; piece = pull(); score = 0; lines = 0; over = false; paused = false; acc = 0; soft = false;
  }
  function lock() {
    cells(piece).forEach(([x, y]) => { if (y >= 0 && y < ROWS && x >= 0 && x < COLS) grid[y][x] = piece.id; });
    let cleared = 0;
    grid = grid.filter((row) => { if (row.every(Boolean)) { cleared++; return false; } return true; });
    while (grid.length < ROWS) grid.unshift(Array(COLS).fill(null));
    if (cleared) { score += [0, 100, 300, 500, 800][cleared]; lines += cleared; beep(520, 0.05); }
    piece = pull();
    if (!fits(piece)) { over = true; scoreHigh('blockfall', score); if (score >= 500) unlock('architect'); beep(90, 0.2); }
  }
  function tick() { const n = { ...piece, y: piece.y + 1 }; if (fits(n)) piece = n; else lock(); }
  function move(dx) { const n = { ...piece, x: piece.x + dx }; if (fits(n)) piece = n; }
  function rotate() {
    const len = SHAPES[piece.id].length;
    const n = { ...piece, r: (piece.r + 1) % len };

  }
  function hard() { let n = 0; while (fits({ ...piece, y: piece.y + 1 })) { piece = { ...piece, y: piece.y + 1 }; n++; } score += n * 2; lock(); }
  onKey = (e) => {
    if (!s.e.classList.contains('f') || over) { if (e.key.toLowerCase() === 'enter') reset(); return; }
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') move(-1);

  addEventListener('keyup', (e) => { if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') soft = false; });

    const k = e.target.dataset.k;

  };
  reset();
  loop(() => dead, (dt) => {
    if (paused || over) return;

  }, () => {
    const { ctx, w, h } = fitCanvas(cv);

    const cell = (x, y, color, a = 1) => { if (y < 0) return; ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillRect(x * cw + 1, y * ch + 1, cw - 2, ch - 2); ctx.globalAlpha = 1; };
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x]) cell(x, y, PCOL[grid[y][x]]);
    if (!over && piece) {
      let gy = piece.y; while (fits({ ...piece, y: gy + 1 })) gy++;
      cells({ ...piece, y: gy }).forEach(([x, y]) => cell(x, y, PCOL[piece.id], 0.25));
      cells(piece).forEach(([x, y]) => cell(x, y, PCOL[piece.id]));
    }
    $('.gscore', s.body).textContent = over ? 'Done ' + score : String(score);
    $('.gbest', s.body).textContent = 'best ' + (cfg.scores.blockfall || 0);
  });
}

function minesApp() {
  const ex = running('mines'); if (ex) return ex.focus();
  const s = win({ title: 'Mines', app: 'mines', w: 460, h: 560 });

  s.body.innerHTML = '<div class="pad col" style="gap:8px;height:100%"><div class="row"><b class="gscore">10</b><span class="sp"></span><button class="btn" type="button" data-d="9">9×9</button><button class="btn" type="button" data-d="16">16×16</button></div><div class="mine"></div></div>';
  const grid = $('.mine', s.body);
  function setup(safe) {
    board = Array.from({ length: rows * cols }, () => ({ m: false, o: false, f: false, n: 0 }));
    let placed = 0;
    while (placed < bombs) {
      const i = Math.floor(Math.random() * board.length);
      if (board[i].m || i === safe) continue;
      const sr = Math.floor(safe / cols), sc2 = safe % cols, r = Math.floor(i / cols), c = i % cols;
      if (Math.abs(sr - r) <= 1 && Math.abs(sc2 - c) <= 1) continue;
      board[i].m = true; placed++;
    }
    for (let i = 0; i < board.length; i++) {
      if (board[i].m) continue;
      const r = Math.floor(i / cols), c = i % cols;
      let n = 0;
      for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) {
        const rr = r + y, cc = c + x;
        if (rr >= 0 && cc >= 0 && rr < rows && cc < cols && board[rr * cols + cc].m) n++;
      }
      board[i].n = n;
    }
    planted = true;
  }
  function open(i) {
    const cell = board[i];
    if (!alive || cell.o || cell.f) return;
    if (!planted) setup(i);
    cell.o = true;
    if (cell.m) { alive = false; board.forEach((c) => { if (c.m) c.o = true; }); beep(90, 0.2); scoreHigh('mines', left); draw(); return; }
    left--;
    if (cell.n === 0) {
      const r = Math.floor(i / cols), c = i % cols;
      for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) {
        const rr = r + y, cc = c + x;
        if (rr >= 0 && cc >= 0 && rr < rows && cc < cols) open(rr * cols + cc);
      }
    }
    if (left === 0) { alive = false; confetti(); toast('Clear field.'); scoreHigh('mines', bombs * 10); }
  }
  function draw() {
    $('.gscore', s.body).textContent = alive ? (bombs - flags) + ' left' : (left === 0 ? 'Clear' : 'Boom');
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.replaceChildren();
    board.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell' + (c.o ? ' open' : '') + (c.o && c.m ? ' bad' : '');
      b.textContent = c.f && !c.o ? '•' : c.o ? (c.m ? '×' : (c.n || '')) : '';
      let hold;
      const flag = (e) => { e.preventDefault(); if (!alive || c.o) return; c.f = !c.f; flags += c.f ? 1 : -1; draw(); };
      b.oncontextmenu = flag;
      b.onpointerdown = () => { hold = setTimeout(() => flag({ preventDefault() {} }), 420); };
      b.onpointerup = () => clearTimeout(hold);
      b.onclick = () => open(i);
      grid.append(b);
    });
  }
  function start(n) {
    cols = rows = n; bombs = n === 9 ? 10 : 40; alive = true; planted = false; flags = 0; left = n * n - bombs;
    board = Array.from({ length: n * n }, () => ({ m: false, o: false, f: false, n: 0 }));
    draw();
  }
  s.body.onclick = (e) => { if (e.target.dataset.d) start(+e.target.dataset.d); };
  start(9);
}

function ricochetApp() {

  hud($('.gwrap', s.body));
  const cv = $('canvas', s.body);
  let ball, padX, bricks, score, lives, over, started, keys = { l: false, r: false };
  function layout(w, h) {
    const cols = 8, rows = 5, gap = 6, top = 36;
    const bw = (w - gap * (cols + 1)) / cols, bh = 18;
    bricks = [];
    const colors = ['#e0a45a', '#ef8f62', '#7eb6d9', '#7ddec2', '#f4efe4'];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) bricks.push({ x: gap + x * (bw + gap), y: top + y * (bh + gap), w: bw, h: bh, on: true, c: colors[y % colors.length] });
  }
  function reset() {
    score = 0; lives = 3; over = false; started = false; padX = 80;
    ball = { x: 120, y: 200, vx: 160, vy: -220 };
    cv._ready = false;
  }
  onKey = (e) => {
    if (!s.e.classList.contains('f')) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.l = e.type === 'keydown';
    if (k === 'arrowright' || k === 'd') keys.r = e.type === 'keydown';

  };
  addEventListener('keydown', onKey);
  addEventListener('keyup', onKey);
  const movePad = (clientX) => {
    const r = cv.getBoundingClientRect();
    const view = cv._view || { w: r.width };
    const pw = Math.max(64, view.w * 0.18);
    padX = Math.max(0, Math.min(view.w - pw, clientX - r.left - pw / 2));
    started = true;
  };
  cv.onpointerdown = (e) => movePad(e.clientX);
  cv.onpointermove = (e) => { if (e.buttons || e.pointerType === 'touch') movePad(e.clientX); };
  $('[data-a=again]', s.body).onclick = reset;
  $('[data-a=pause]', s.body).onclick = () => { started = !started; };
  reset();
  loop(() => dead, (dt) => {
    const r = cv.getBoundingClientRect();
    const w = Math.max(10, r.width), h = Math.max(10, r.height);
    if (!cv._ready && w > 40) { layout(w, h); cv._ready = true; cv._bw = w; }
    cv._view = { w, h };
    const pw = Math.max(64, w * 0.18), ph = 12, padY = h - 28;
    if (keys.l) padX = Math.max(0, padX - 360 * dt);
    if (keys.r) padX = Math.min(w - pw, padX + 360 * dt);
    if (!started || over || !bricks) return;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const R = 7;
    if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > w - R) { ball.x = w - R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); }
    if (ball.vy > 0 && ball.y + R >= padY && ball.y - R <= padY + ph && ball.x >= padX && ball.x <= padX + pw) {
      const hit = (ball.x - (padX + pw / 2)) / (pw / 2);
      const sp = 340;
      ball.vx = hit * sp;
      ball.vy = -Math.sqrt(Math.max(40, sp * sp - ball.vx * ball.vx));
      beep(420, 0.03);
    }

      lives--;

    }
    for (const b of bricks) {
      if (!b.on) continue;
      if (ball.x > b.x - R && ball.x < b.x + b.w + R && ball.y > b.y - R && ball.y < b.y + b.h + R) {
        b.on = false; score += 10; beep(640, 0.03);
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        if (Math.abs(ball.x - cx) / b.w > Math.abs(ball.y - cy) / b.h) ball.vx *= -1; else ball.vy *= -1;
        break;
      }
    }
    if (bricks.every((b) => !b.on)) { over = true; scoreHigh('ricochet', score); confetti(); }
  }, () => {
    const { ctx, w, h } = fitCanvas(cv);
    const pw = Math.max(64, w * 0.18), padY = h - 28;
    ctx.fillStyle = '#101218'; ctx.fillRect(0, 0, w, h);
    (bricks || []).forEach((b) => { if (!b.on) return; ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.w, b.h); });
    ctx.fillStyle = '#f4efe4'; ctx.fillRect(padX, padY, pw, 12);

    $('.gbest', s.body).textContent = 'lives ' + lives + ' · best ' + (cfg.scores.ricochet || 0);
  });
}

function mergeApp() {
  const ex = running('merge'); if (ex) return ex.focus();
  const s = win({ title: 'Merge', app: 'merge', w: 420, h: 560 });
  let grid, score, over;
  s.body.innerHTML = '<div class="gwrap"><div class="merge"></div><p class="sub">Arrows, WASD, or swipe. A slides left.</p></div>';
  hud($('.gwrap', s.body));
  const board = $('.merge', s.body);
  function reset() {
    grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    score = 0; over = false; spawn(); spawn(); draw();
  }
  function spawn() {
    const empty = [];
    grid.forEach((row, y) => row.forEach((v, x) => { if (!v) empty.push([x, y]); }));
    if (!empty.length) return;
    const [x, y] = empty[Math.floor(Math.random() * empty.length)];
    grid[y][x] = Math.random() < 0.9 ? 2 : 4;
  }
  function slide(row) {
    const a = row.filter(Boolean);
    for (let i = 0; i < a.length - 1; i++) if (a[i] === a[i + 1]) { a[i] *= 2; score += a[i]; if (a[i] === 2048) toast('2048.'); a.splice(i + 1, 1); }
    while (a.length < 4) a.push(0);
    return a;
  }
  function moved(next) { return next.some((row, y) => row.some((v, x) => v !== grid[y][x])); }
  function move(dir) {
    if (over) return;
    const sc = score;
    let next;
    if (dir === 'left') next = grid.map((r) => slide([...r]));
    if (dir === 'right') next = grid.map((r) => slide([...r].reverse()).reverse());
    if (dir === 'up' || dir === 'down') {
      next = Array.from({ length: 4 }, () => Array(4).fill(0));
      for (let x = 0; x < 4; x++) {
        let col = [0, 1, 2, 3].map((y) => grid[y][x]);
        if (dir === 'down') col.reverse();
        col = slide(col);
        if (dir === 'down') col.reverse();
        col.forEach((v, y) => { next[y][x] = v; });
      }
    }
    if (!next || !moved(next)) { score = sc; return; }
    grid = next; spawn();
    const stuck = !['left', 'right', 'up', 'down'].some((d) => can(d));
    if (stuck) { over = true; scoreHigh('merge', score); }
    draw();
  }
  function can(dir) {
    const sc = score;
    const copy = grid.map((r) => [...r]);
    const prev = JSON.stringify(copy);
    const saved = grid;
    grid = copy;
    let next;
    if (dir === 'left') next = grid.map((r) => slide([...r]));
    else if (dir === 'right') next = grid.map((r) => slide([...r].reverse()).reverse());
    else {
      next = Array.from({ length: 4 }, () => Array(4).fill(0));
      for (let x = 0; x < 4; x++) {
        let col = [0, 1, 2, 3].map((y) => grid[y][x]);
        if (dir === 'down') col.reverse();
        col = slide(col);
        if (dir === 'down') col.reverse();
        col.forEach((v, y) => { next[y][x] = v; });
      }
    }
    const changed = JSON.stringify(next) !== prev;
    grid = saved;
    score = sc;
    return changed;
  }
  function draw() {
    board.replaceChildren();
    grid.flat().forEach((v) => {
      const t = el('<div class="tile"></div>');
      t.textContent = v || '';
      t.dataset.v = String(v || 0);
      board.append(t);
    });
    $('.gscore', s.body).textContent = over ? 'Done ' + score : String(score);
    $('.gbest', s.body).textContent = 'best ' + (cfg.scores.merge || 0);
  }
  addEventListener('keydown', function onKey(e) {
    if (!s.e.isConnected) return removeEventListener('keydown', onKey);
    if (!s.e.classList.contains('f')) return;
    const k = e.key.toLowerCase();
    const map = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
    if (!map[k]) return;
    e.preventDefault();
    move(map[k]);
  });
  let sx = 0, sy = 0;
  board.ontouchstart = (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  board.ontouchend = (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.hypot(dx, dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  };
  $('[data-a=again]', s.body).onclick = reset;
  $('[data-a=pause]', s.body).style.display = 'none';
  reset();
}

function cipherApp() {

  let answer = ans;
  const board = $('.board', s.body), keys = $('.keys', s.body);
  const KEYS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  function paint() {
    board.replaceChildren();

      const scored = rows[r] ? grade(rows[r], answer) : [];

      }

      }
      keys.append(row);
    });
  }
  function grade(g, a) {
    const res = Array(5).fill('b'); const left = {};
    for (let i = 0; i < 5; i++) if (g[i] === a[i]) res[i] = 'g'; else left[a[i]] = (left[a[i]] || 0) + 1;
    for (let i = 0; i < 5; i++) if (res[i] !== 'g' && left[g[i]]) { res[i] = 'y'; left[g[i]]--; }
    return res;
  }
  function keyState(ch) {
    let st = '';
    rows.forEach((g) => grade(g, answer).forEach((r, i) => { if (g[i] !== ch) return; if (r === 'g') st = 'g'; else if (r === 'y' && st !== 'g') st = 'y'; else if (!st) st = 'b'; }));
    return st;
  }
  function type(ch) { if (done || cur.length >= 5) return; cur += ch; paint(); }
  function back() { if (done) return; cur = cur.slice(0, -1); paint(); }
  function submit() {
    if (done) return;

function noughtsApp() {
  const ex = running('noughts'); if (ex) return ex.focus();
  const s = win({ title: 'Noughts', app: 'noughts', w: 380, h: 460 });
  let board, turn, lock;
  s.body.innerHTML = '<div class="pad col center-col"><div class="sub status"></div><div class="xo"></div><button class="btn" type="button">Again</button><p class="sub">You are crosses. It does not lose.</p></div>';
  const grid = $('.xo', s.body), status = $('.status', s.body);
  const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  function winner(b) {
    for (const [a, c, d] of lines) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    if (b.every(Boolean)) return 'draw';
    return '';
  }
  function ai(b) {
    function mm(bd, t) {
      const w = winner(bd);
      if (w === 'X') return { s: -1 };
      if (w === 'O') return { s: 1 };
      if (w === 'draw') return { s: 0 };
      let best = null;
      for (let i = 0; i < 9; i++) if (!bd[i]) {
        bd[i] = t;
        const r = mm(bd, t === 'X' ? 'O' : 'X');
        bd[i] = '';
        if (t === 'O') { if (!best || r.s > best.s) best = { s: r.s, i }; }
        else if (!best || r.s < best.s) best = { s: r.s, i };
      }
      return best || { s: 0, i: 0 };
    }
    return mm(b, 'O').i;
  }
  function draw() {
    grid.replaceChildren();
    board.forEach((v, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = v === 'X' ? '×' : v === 'O' ? '○' : '';
      b.onclick = () => play(i);
      grid.append(b);
    });
    const w = winner(board);
    status.textContent = w === 'X' ? 'You won?' : w === 'O' ? 'Vault wins.' : w === 'draw' ? 'Draw.' : 'Your move';
    if (w === 'X') { confetti(); unlock('gamer'); }
  }
  function play(i) {
    if (lock || board[i] || winner(board)) return;
    board[i] = 'X';
    if (!winner(board)) { lock = true; draw(); setTimeout(() => { const m = ai(board); if (!board[m]) board[m] = 'O'; lock = false; draw(); }, 180); }
    else draw();
  }
  function reset() { board = Array(9).fill(''); lock = false; draw(); }
  $('button.btn', s.body).onclick = reset;
  reset();
}

  if (map[id]) return map[id]();
  const a = CATALOG.find((x) => x.id === id);
  if (a && a.kind === 'web') return webApp(a);
}
function dock() {
  const d = $('#dock');
  d.replaceChildren();
  const ids = ['proxy', 'store', 'notes', 'terminal', 'settings', ...(cfg.isAdmin ? ['admin'] : []), ...cfg.installed];
  ids.forEach((id) => {
    const m = meta(id);
    if (!m.name || (id !== 'proxy' && !CORE[id] && !CATALOG.some((a) => a.id === id) && id !== 'admin')) return;
    if (!CORE[id] && !CATALOG.some((a) => a.id === id)) return;
    const e = el(`<div class="dk" tabindex="0" role="button"></div>`);
    e.dataset.id = id;
    e.innerHTML = icon(id) + '<span></span>';
    $('span', e).textContent = m.name;
    e.onclick = () => { const w = running(id); if (w) w.focus(); else launch(id); };
    e.onkeydown = (ev) => { if (ev.key === 'Enter') e.click(); };
    d.append(e);
  });
  markRunning();
}
function markRunning() { $$('.dk').forEach((e) => e.classList.toggle('run', !!running(e.dataset.id))); }

let mode = 'login';
function authOpen(m) {
  mode = m || 'login';
  const su = mode === 'signup';
  $$('#aseg div').forEach((d) => d.classList.toggle('on', d.dataset.m === mode));
  $('#acl').hidden = $('#ac').hidden = !su;
  $('#as').textContent = su ? 'Create account' : 'Log in';
  $('#ae').textContent = '';
  $('#auth').classList.add('show');
  setTimeout(() => $('#au').focus(), 60);
}
async function submitAuth() {
  const u = $('#au').value.trim(), p = $('#ap').value, c = $('#ac').value, er = $('#ae'), b = $('#as');
  er.textContent = '';
  if (!u || !p) return er.textContent = 'Enter a username and password.';
  if (mode === 'signup') {
    if (p !== c) return er.textContent = 'Passwords do not match.';
    if (p.length < 8) return er.textContent = 'Password needs at least 8 characters.';
  }
  b.disabled = true; const t = b.textContent; b.textContent = 'Working…';
  try {
    const r = await fetch(base() + (mode === 'login' ? '/login' : '/signup'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    Object.assign(cfg, { username: d.user.username, sessionToken: d.sessionToken, proxyToken: d.proxyToken, isAdmin: !!d.user.isAdmin });
    await save();
    $('#auth').classList.remove('show');
    paint(); dock(); startup();
  } catch (e) { er.textContent = e.message; }
  finally { b.disabled = false; b.textContent = t; }
}
async function logout() {
  if (!confirm('Sign out?')) return;
  try { await lv(base() + '/logout', { method: 'POST' }); } catch { /* ignore */ }
  Object.assign(cfg, { username: '', sessionToken: '', proxyToken: '', isAdmin: false });
  await save(); location.reload();
}
function startup() {
  if (started) return;
  started = true;
  daily(); checkAch();
  if (cfg.startup && cfg.startup !== 'none') setTimeout(() => launch(cfg.startup), 160);
  if (!cfg.hints.scene && cfg.wall === 'scene') {
    cfg.hints.scene = 1; save();
    setTimeout(() => toast('Drag the wallpaper pieces. They stay where you leave them.'), 700);
  }
}

function spotItems() {
  const items = [];
  Object.keys(CORE).forEach((id) => { if (id === 'admin' && !cfg.isAdmin) return; items.push({ k: CORE[id][0], sub: 'App', go: () => launch(id) }); });
  CATALOG.forEach((a) => items.push({ k: a.name, sub: a.cat, go: () => { if (!cfg.installed.includes(a.id) && a.kind !== 'web') { /* allow launch anyway */ } launch(a.id); } }));
  Object.entries(themeList()).forEach(([id, t]) => items.push({ k: t[0] + ' theme', sub: 'Look', go: async () => { noteTheme(id); await save(); paint(); } }));
  Object.entries(SCENES).forEach(([id, sc]) => items.push({ k: sc.name + ' wallpaper', sub: 'Scene', go: async () => { cfg.wall = 'scene'; cfg.scene = id; await save(); renderScene(); paint(); } }));
  items.push({ k: 'Plain wallpaper', sub: 'Scene', go: async () => { cfg.wall = 'plain'; await save(); paint(); } });
  items.push({ k: 'Shortcuts', sub: 'Help', go: () => helpApp() });
  items.push({ k: 'Panic', sub: 'Leave', go: () => panic() });
  return items;
}
function openSpot() {
  $('#spot').classList.add('show');
  $('#sq').value = '';
  spotIdx = 0;
  drawSpot();
  setTimeout(() => $('#sq').focus(), 30);
}
function drawSpot() {
  const q = $('#sq').value.toLowerCase();
  const items = spotItems().filter((it) => !q || (it.k + it.sub).toLowerCase().includes(q)).slice(0, 8);
  if (spotIdx >= items.length) spotIdx = 0;
  const box = $('#sres');
  box.replaceChildren();
  items.forEach((it, i) => {
    const r = el(`<div class="srow${i === spotIdx ? ' on' : ''}"></div>`);
    const a = el('<b></b>'); a.textContent = it.k;
    const b = el('<span class="sub"></span>'); b.textContent = it.sub;
    r.append(a, b);
    r.onmousemove = () => { spotIdx = i; $$('.srow').forEach((n, j) => n.classList.toggle('on', j === i)); };
    r.onclick = () => { $('#spot').classList.remove('show'); it.go(); };
    box.append(r);
  });
  if (!items.length) box.append(el('<div class="srow"><span class="sub">Nothing under that.</span></div>'));
  box._items = items;
}
function openQuick() {
  const q = $('#qpanel');
  if (!q.hidden) { q.hidden = true; return; }
  q.hidden = false;
  q.replaceChildren();
  const themes = el('<div class="th mini"></div>');
  Object.entries(themeList()).slice(0, 8).forEach(([k, t]) => {
    const c = el('<button class="tc" type="button"></button>');
    c.style.background = t[1]; c.style.color = t[3]; c.textContent = t[0];
    if (cfg.theme === k) c.classList.add('on');
    c.onclick = async () => { noteTheme(k); await save(); paint(); openQuick(); openQuick(); };
    themes.append(c);
  });
  const sceneBtn = el('<button class="btn" type="button"></button>');
  sceneBtn.textContent = cfg.wall === 'scene' ? (SCENES[cfg.scene]?.name || 'Scene') : cfg.wall;
  sceneBtn.onclick = async () => {
    const keys = Object.keys(SCENES);
    const i = keys.indexOf(cfg.scene);
    cfg.wall = 'scene'; cfg.scene = keys[(i + 1) % keys.length];
    await save(); renderScene(); paint(); q.hidden = true;
  };
  q.append(el('<div class="sub">Quick look</div>'), themes, el('<div class="row wrap"></div>'));
  const row = $('.row', q);
  row.append(sceneBtn, el('<button class="btn" type="button">Settings</button>', { onclick: () => { q.hidden = true; settingsApp(); } }));
}
function openMenu(x, y) {
  const m = $('#menu');
  const items = [
    ['Search', openSpot],
    ['Proxy', () => launch('proxy')],
    ['Notes', () => launch('notes')],
    ['Store', () => launch('store')],
    ['Next wallpaper', async () => { const keys = Object.keys(SCENES); cfg.wall = 'scene'; cfg.scene = keys[(keys.indexOf(cfg.scene) + 1) % keys.length]; await save(); renderScene(); paint(); }],
    [cfg.sceneLock ? 'Unlock pieces' : 'Lock pieces', async () => { cfg.sceneLock = !cfg.sceneLock; await save(); renderScene(); }],
    ['Settings', () => settingsApp()],
  ];
  m.replaceChildren();
  items.forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    b.onclick = () => { m.hidden = true; fn(); };
    m.append(b);
  });
  m.hidden = false;
  const mw = 220, mh = 280;
  m.style.left = Math.min(x, innerWidth - mw) + 'px';
  m.style.top = Math.min(y, innerHeight - mh) + 'px';
}

function normalize() {
  cfg.server = SERVER;
  if (!cfg.stats || !Array.isArray(cfg.stats.sites)) cfg.stats = { sites: [], themes: [], notes: 0, cmds: 0, reqs: 0 };
  if (!Array.isArray(cfg.achievements)) cfg.achievements = [];
  if (!Array.isArray(cfg.installed)) cfg.installed = ['calc'];
  if (!cfg.scores) cfg.scores = {};
  if (!cfg.hints) cfg.hints = {};
  if (!cfg.wall) cfg.wall = bgData ? 'photo' : 'scene';
  if (!cfg.scene || !SCENES[cfg.scene]) cfg.scene = 'orbit';
  if (typeof cfg.parallax !== 'boolean') cfg.parallax = true;
  if (typeof cfg.sceneLock !== 'boolean') cfg.sceneLock = false;
  if (typeof cfg.widgetClock !== 'boolean') cfg.widgetClock = true;
  cfg.installed = cfg.installed.filter((id) => CATALOG.some((a) => a.id === id));
}
function pomoTick() {
  if (pomo && Date.now() >= pomo.end) {
    const modeWas = pomo.mode;
    pomo = null;
    beep(880, 0.15); setTimeout(() => beep(1174, 0.2), 160);
    toast(modeWas === 'focus' ? 'Focus block done.' : 'Break over.');
    if (modeWas === 'focus') unlock('focused');
    confetti();
  }
  const w = running('timer');
  if (w && w.api && w.api.draw) w.api.draw();
}

function bind() {
  const hot = $('#hot'), bar = $('#bar'), B = document.body.classList;
  hot.onmouseenter = () => B.add('peek');
  hot.onclick = () => B.toggle('peek');
  hot.onmouseleave = () => setTimeout(() => { if (!bar.matches(':hover')) B.remove('peek'); }, 60);
  bar.onmouseleave = () => { if (B.contains('fs')) B.remove('peek'); };
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !B.contains('fs')) return;
    const w = [...wins.values()].find((x) => x.max && x.e.classList.contains('f'));
    if (w) zoom(w);
  });
  $('#panic').onclick = panic;
  $('#logo').onclick = () => {
    logoClicks++;
    beep(400 + logoClicks * 30, 0.05);
    if (logoClicks >= 7) {
      logoClicks = 0;
      unlock('keeper');
      noteTheme('void'); save(); paint();
      toast('The lock turned.');
    }
  };
  $('#spotbtn').onclick = openSpot;
  $('#qbtn').onclick = openQuick;
  $('#helpbtn').onclick = () => helpApp();
  $$('#aseg div').forEach((d) => { d.onclick = () => authOpen(d.dataset.m); });
  $('#as').onclick = submitAuth;
  $('#offline').onclick = () => { $('#auth').classList.remove('show'); toast('Offline. Proxy waits until you log in.'); startup(); };
  ['au', 'ap', 'ac'].forEach((id) => $('#' + id).addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); }));
  $('#sq').oninput = () => { spotIdx = 0; drawSpot(); };
  $('#sq').onkeydown = (e) => {
    const items = $('#sres')._items || [];
    if (e.key === 'ArrowDown') { spotIdx = Math.min(items.length - 1, spotIdx + 1); drawSpot(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { spotIdx = Math.max(0, spotIdx - 1); drawSpot(); e.preventDefault(); }
    else if (e.key === 'Enter' && items[spotIdx]) { $('#spot').classList.remove('show'); items[spotIdx].go(); }
    else if (e.key === 'Escape') $('#spot').classList.remove('show');
  };
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    ki = k === KS[ki] ? ki + 1 : k === KS[0] ? 1 : 0;
    if (ki === KS.length) { ki = 0; unlock('konami'); }
    const typing = e.target && (e.target.matches && e.target.matches('input, textarea'));
    if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); openSpot(); return; }
    if (e.key === 'Escape') { $('#spot').classList.remove('show'); $('#qpanel').hidden = true; $('#menu').hidden = true; }
    if (e.key === cfg.panicKey && !e.ctrlKey && !e.metaKey && !window._capturing && !typing) { e.preventDefault(); panic(); }
    if (e.altKey && /^[1-5]$/.test(e.key) && !typing) launch(['proxy', 'store', 'notes', 'terminal', 'settings'][e.key - 1]);
  }, true);
  addEventListener('pointermove', (e) => {
    if (!cfg.parallax || cfg.wall !== 'scene') return;
    const x = (e.clientX / innerWidth - 0.5) * 16;
    const y = (e.clientY / innerHeight - 0.5) * 10;
    $('#scene').style.setProperty('--px', x.toFixed(2));
    $('#scene').style.setProperty('--py', y.toFixed(2));
  });
  addEventListener('contextmenu', (e) => {
    if (e.target.closest('.win') || e.target.closest('#bar') || e.target.closest('#dock') || e.target.closest('.ov') || e.target.closest('input, textarea')) return;
    e.preventDefault();
    openMenu(e.clientX, e.clientY);
  });
  addEventListener('pointerdown', (e) => {
    if (!e.target.closest('#qpanel') && e.target.id !== 'qbtn') $('#qpanel').hidden = true;
    if (!e.target.closest('#menu')) $('#menu').hidden = true;
  });
  setInterval(() => {
    const d = new Date();
    $('#clk').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    renderMe(); renderWidgets(); pomoTick();
  }, 1000);
}

async function boot() {
  try { db = await open(); }
  catch (e) { alert('Storage is unavailable in this browser.'); return; }
  const sv = await get('config');
  if (sv) cfg = { ...DEF, ...sv };
  bgData = (await get('bg')) || '';
  scenePos = (await get('scenePos')) || {};
  sceneMeta = (await get('sceneMeta')) || {};
  normalize();
  fav0 = $('#favicon') ? $('#favicon').href : '';
  paint();
  if (cfg.wall === 'scene') renderScene();
  dock();
  health(); sched(); bind();
  if (!cfg.server) return setTimeout(settingsApp, 200);
  if (!cfg.sessionToken || !cfg.username) return setTimeout(() => authOpen('login'), 240);
  try {
    const r = await lv(base() + '/me');
    if (r.status === 401 || r.status === 403) { const err = new Error('auth'); err.auth = 1; throw err; }
    if (!r.ok) throw new Error('bad');
    const d = await r.json();
    Object.assign(cfg, { username: d.username, isAdmin: !!d.isAdmin, proxyToken: d.proxyToken || '' });
    await save(); paint(); dock(); startup();
  } catch (e) {
    if (e.auth) {
      Object.assign(cfg, { sessionToken: '', username: '', proxyToken: '', isAdmin: false });
      await save(); paint(); setTimeout(() => authOpen('login'), 200);
    } else {
      toast('Server unreachable. Working offline.');
      startup();
    }
  }
}
boot();
}

</script>
</body>
